name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与 package.json engines（>=22）保持一致；升级时两处同时改
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 类型检查 + ESLint + Prettier + 单元测试 + 结构/红线检查
      - name: Quality gate
        run: npm run check
